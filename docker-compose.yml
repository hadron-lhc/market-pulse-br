services:
  postgres:
    image: postgres:16
    container_name: olist-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeit}
      POSTGRES_DB: ${POSTGRES_DB:-olist_analytics}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - olist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olist_analytics"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  olist_pgdata:
