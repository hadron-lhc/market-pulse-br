version: 2

models:
  - name: stg_orders
    description: "One row per order (source: raw.orders). Grain: order_id."
    columns:
      - name: order_id
        description: Primary key of the order.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Order-level customer identifier (not unique per person).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: order_purchase_timestamp
        tests:
          - not_null
      - name: order_estimated_delivery_date
        tests:
          - not_null

  - name: stg_customers
    description: "One row per order-level customer identifier (source: raw.customers). Grain: customer_id."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Stable identifier used for repeat-purchase analysis.
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null

  - name: stg_sellers
    description: "One row per seller (source: raw.sellers). Grain: seller_id."
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: seller_state
        tests:
          - not_null

  - name: stg_products
    description: >
      One row per product with the English category name joined in
      (source: raw.products + raw.product_category_name_translation).
      Grain: product_id.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_category
        description: English category when translated, Portuguese otherwise, 'unknown' when null.
        tests:
          - not_null

  - name: stg_order_items
    description: "One row per item within an order (source: raw.order_items). Grain: (order_id, order_item_id)."
    columns:
      - name: order_item_key
        description: Composite surrogate key (order_id || '-' || order_item_id).
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: price
        description: Item price in BRL, excluding freight.
        tests:
          - not_null
      - name: freight_value
        tests:
          - not_null

  - name: stg_order_payments
    description: "One row per payment record of an order. Grain: (order_id, payment_sequential)."
    columns:
      - name: payment_key
        description: Composite surrogate key (order_id || '-' || payment_sequential).
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_installments
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: stg_order_reviews
    description: >
      One row per review record (source: raw.order_reviews). No unique key exists:
      review_id is duplicated in the source and 547 orders carry more than one
      review. Deduplication to one review per order happens in int_reviews_agg.
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

  - name: stg_geolocation
    description: >
      One row per zip-code geolocation observation. No primary key; used only
      aggregated to zip centroids in int_zip_centroids.
    columns:
      - name: zip_code_prefix
        tests:
          - not_null
